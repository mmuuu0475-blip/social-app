<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 300px; }

        .btn { background-color: #0084ff; color: white; text-decoration: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; display: block; transition: 0.3s; }
        .btn:hover { background-color: #0073e6; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <img src="icon.png" alt="FasterFast" class="logo">

        <p>دردشة بسيطة، مريحة، وعصرية.</p>

</html>
